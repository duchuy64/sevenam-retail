<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Seven.AM Internal Reporting Hub – công cụ nội bộ tổng hợp 4 dashboard báo cáo bán lẻ và showroom.">
  <title>Seven.AM – Internal Reporting Hub</title>
  <link rel="stylesheet" href="hub.css?v=1.0.0">
</head>
<body>
  <div class="hub" id="hub">
    <header class="hub-header">
      <div class="identity">
        <div class="brand-mark" aria-hidden="true">7A</div>
        <div class="brand-copy">
          <div class="eyebrow">SEVEN.AM • INTERNAL REPORTING</div>
          <div class="title-row">
            <h1>Trung tâm Dashboard Báo cáo</h1>
            <span class="internal-badge">DÙNG NỘI BỘ</span>
          </div>
          <p id="moduleDescription">Theo dõi doanh số ngày theo khung giờ và tiến độ thời gian của 16 showroom.</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="openStandalone" type="button" title="Mở báo cáo hiện tại ở tab riêng">
          <span aria-hidden="true">↗</span><span class="action-label">Mở riêng</span>
        </button>
        <button class="icon-btn" id="toggleFocus" type="button" title="Ẩn/hiện thanh điều hướng">
          <span aria-hidden="true">⛶</span><span class="action-label">Tập trung</span>
        </button>
      </div>
    </header>

    <nav class="tabs" aria-label="4 báo cáo nội bộ" role="tablist">
      <button class="tab active" type="button" role="tab" aria-selected="true" data-tab="bc1">
        <span class="tab-code">BC1</span>
        <span class="tab-main">Doanh số theo khung giờ</span>
        <span class="tab-sub">Tiến độ trong ngày</span>
      </button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="bc2">
        <span class="tab-code">BC2</span>
        <span class="tab-main">BXH doanh số showroom</span>
        <span class="tab-sub">HTTG 16 cửa hàng</span>
      </button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="bc3">
        <span class="tab-code">BC3</span>
        <span class="tab-main">KPI hệ thống bán lẻ</span>
        <span class="tab-sub">Target tháng & hiệu suất</span>
      </button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="bc4">
        <span class="tab-code">BC4</span>
        <span class="tab-main">BXH bán túi</span>
        <span class="tab-sub">KPI túi toàn hệ thống</span>
      </button>
    </nav>

    <main class="workspace">
      <div class="frame-shell">
        <iframe id="reportFrame" title="BC1 – Doanh số theo khung giờ" src="modules/bc1/index.html" loading="eager"></iframe>
        <div class="loading" id="loading" aria-live="polite"><span class="spinner"></span><span>Đang mở báo cáo…</span></div>
      </div>
    </main>
  </div>

  <button id="restoreNav" class="restore-nav" type="button" title="Hiện thanh điều hướng">☰ Báo cáo</button>
  <script src="hub.js?v=1.0.0"></script>
</body>
</html>
